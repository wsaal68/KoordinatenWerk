name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build release bundle
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          zip -r "koordinatenwerk-${tag}.zip" \
            index.html \
            images \
            LICENSE \
            README.md \
            -x "*/.DS_Store"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            koordinatenwerk-${{ github.ref_name }}.zip
          generate_release_notes: true
